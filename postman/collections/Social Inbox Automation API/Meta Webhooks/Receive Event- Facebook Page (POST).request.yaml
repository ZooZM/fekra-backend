$kind: http-request
name: "Receive Event: Facebook Page (POST)"
description: "Simulates a Facebook Page event (`object: page`) routed to `MetaWebhookService.handleEvent`. Example: an incoming Messenger message."
url: "{{baseUrl}}/webhooks/meta"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "object": "page",
      "entry": [
        {
          "id": "{{pageId}}",
          "time": 1730000000000,
          "messaging": [
            {
              "sender": {
                "id": "1234567890"
              },
              "recipient": {
                "id": "{{pageId}}"
              },
              "timestamp": 1730000000000,
              "message": {
                "mid": "m_abc123",
                "text": "What are your opening hours?"
              }
            }
          ]
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // Computes X-Hub-Signature-256 = 'sha256=' + HMAC_SHA256(rawBody, metaAppSecret)
      const secret = pm.collectionVariables.get('metaAppSecret');
      const raw = pm.variables.replaceIn(pm.request.body.raw);
      const sig = CryptoJS.HmacSHA256(raw, secret).toString(CryptoJS.enc.Hex);
      pm.request.headers.upsert({ key: 'x-hub-signature-256', value: 'sha256=' + sig });
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 2000
