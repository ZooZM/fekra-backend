$kind: http-request
name: "Receive Event: Instagram Comment (POST)"
description: "Simulates an Instagram comment event (`changes` with `field: comments`)."
url: "{{baseUrl}}/webhooks/meta"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "object": "instagram",
      "entry": [
        {
          "id": "{{igAccountId}}",
          "time": 1730000000,
          "changes": [
            {
              "field": "comments",
              "value": {
                "id": "17900000000000001",
                "text": "Love this! How much is it?",
                "from": {
                  "id": "1234567890",
                  "username": "test_user"
                },
                "media": {
                  "id": "17800000000000001",
                  "media_product_type": "FEED"
                }
              }
            }
          ]
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // Computes X-Hub-Signature-256 = 'sha256=' + HMAC_SHA256(rawBody, metaAppSecret)
      const secret = pm.collectionVariables.get('metaAppSecret');
      const raw = pm.variables.replaceIn(pm.request.body.raw);
      const sig = CryptoJS.HmacSHA256(raw, secret).toString(CryptoJS.enc.Hex);
      pm.request.headers.upsert({ key: 'x-hub-signature-256', value: 'sha256=' + sig });
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 5000
