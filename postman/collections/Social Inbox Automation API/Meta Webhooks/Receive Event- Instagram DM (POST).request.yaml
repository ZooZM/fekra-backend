$kind: http-request
name: "Receive Event: Instagram DM (POST)"
description: "Simulates an Instagram event (`object: instagram`) routed to `InstagramWebhookService.handleEvent`."
url: "{{baseUrl}}/webhooks/meta"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "object": "instagram",
      "entry": [
        {
          "id": "{{igAccountId}}",
          "time": 1730000000,
          "messaging": [
            {
              "sender": {
                "id": "1234567890"
              },
              "recipient": {
                "id": "{{igAccountId}}"
              },
              "timestamp": 1730000000000,
              "message": {
                "mid": "ig_m_abc123",
                "text": "Hi, do you have this in stock?"
              }
            }
          ]
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // Computes X-Hub-Signature-256 = 'sha256=' + HMAC_SHA256(rawBody, metaAppSecret)
      const secret = pm.collectionVariables.get('metaAppSecret');
      const raw = pm.variables.replaceIn(pm.request.body.raw);
      const sig = CryptoJS.HmacSHA256(raw, secret).toString(CryptoJS.enc.Hex);
      pm.request.headers.upsert({ key: 'x-hub-signature-256', value: 'sha256=' + sig });
    language: text/javascript
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 4000
