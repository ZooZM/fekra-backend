$kind: http-request
description: |-
  Updates a service.

  **Body:** `UpdateServiceDto`

  > **Note:** The exact body schema lives in the Zod schema referenced by the controller. The example body below is illustrative; adjust the fields to match your schema.
url: "{{baseUrl}}/services/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  id: "{{resourceId}}"
body:
  type: json
  content: |-
    {
      "name": "Premium Catering",
      "price": 300
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 4000
