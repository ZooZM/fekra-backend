$kind: http-request
description: |-
  Lists every comment the platform classified, newest first. **Requires:** `ADMIN` or `CLIENT` role (a `CLIENT` user is scoped to their own client; `clientId` only applies to `ADMIN`).

  **Query:** `page`, `limit`, `orderDir`, `clientId`, `platform`, `classification` (`engagement`, `inquiry`, `unsure`, `complaint`, `spam`, `insult`), `decisionBasis` (`rules`, `ai_model`, `safe_fallback`, `unknown`), `from`, `to` (a `to` before `from` is `422` on `to`). Enum values are case-insensitive.

  **Each item** has `clientName`, `decisionBasis` (`RULES`, `AI_MODEL`, `SAFE_FALLBACK`, `UNKNOWN`) and `decisionModel` (the model name for `AI_MODEL`). Comments from before the basis was recorded are `UNKNOWN`. A comment labelled `SPAM` with basis `SAFE_FALLBACK` was **not** judged to be spam: the AI model failed and spam is the safe default.

  Comments of clients with comment automation turned off are not classified, so they are not in this list.
url: "{{baseUrl}}/comment-replies?page=1&limit=20"
method: GET
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number
  - key: limit
    value: "20"
    disabled: false
    description: Page size
  - key: classification
    value: complaint
    disabled: true
    description: Label filter
  - key: decisionBasis
    value: ai_model
    disabled: true
    description: How the label was decided (rules, ai_model, safe_fallback, unknown)
  - key: from
    value: "2026-11-01"
    disabled: true
    description: From this date
  - key: to
    value: "2026-11-30"
    disabled: true
    description: Until this date
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Each comment says how it was decided', () => {
        json.data.forEach((c) => {
          pm.expect(c).to.have.property('decisionBasis');
          pm.expect(c).to.have.property('clientName');
        });
      });
    language: text/javascript
order: 1000
