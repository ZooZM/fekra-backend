$kind: http-request
name: "Admin: Update User"
description: |-
  Updates a user as an admin. Uses `{{resourceId}}`.

  **Body:** `AdminUpdateUserDto`

  > **Note:** The exact body schema lives in the Zod schema referenced by the controller. The example body below is illustrative; adjust the fields to match your schema.
url: "{{baseUrl}}/users/admin/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  id: "{{resourceId}}"
body:
  type: json
  content: |-
    {
      "name": "Renamed User",
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 7000
