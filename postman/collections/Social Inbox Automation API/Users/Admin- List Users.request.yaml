$kind: http-request
name: "Admin: List Users"
description: |-
  Lists users with filtering/pagination.

  **Query:** `QueryUserDto`
url: "{{baseUrl}}/users/admin?page=1&limit=20"
method: GET
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number
  - key: limit
    value: "20"
    disabled: false
    description: Page size
  - key: search
    value: ""
    disabled: true
    description: Free-text search
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 3000
