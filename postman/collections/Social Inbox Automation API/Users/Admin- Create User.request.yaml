$kind: http-request
name: "Admin: Create User"
description: |-
  Creates a user as an admin.

  **Body:** `AdminCreateUserDto`

  > **Note:** The exact body schema lives in the Zod schema referenced by the controller. The example body below is illustrative; adjust the fields to match your schema.
url: "{{baseUrl}}/users/admin"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "New User",
      "email": "new.user@example.com",
      "password": "StrongP@ssw0rd",
      "role": "USER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200, 201]', () => pm.expect([200, 201]).to.include(pm.response.code));
      const json = pm.response.json();
      const id = json.id || json._id || (json.data && (json.data.id || json.data._id));
      if (id) { pm.collectionVariables.set('resourceId', id); console.log('resourceId saved:', id); }
