$kind: http-request
name: "Admin: Get User By Email"
description: |-
  Fetches a user by email. Uses `{{userEmail}}`.

  URL-encode special characters such as `+` (`%2B`).
url: "{{baseUrl}}/users/admin/email/:email"
method: GET
pathVariables:
  email: "{{userEmail}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 5000
