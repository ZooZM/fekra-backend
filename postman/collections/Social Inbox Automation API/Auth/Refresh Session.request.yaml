$kind: http-request
description: |-
  Trades the `fekra_session` cookie for a new access token (10 minutes). The cookie is rotated on every call.

  **Needs:** the cookie from *Login* (Postman keeps it in its cookie jar) and an `Origin` header equal to `APP_ORIGIN` (the `appOrigin` variable). Requests with another origin get `403`.

  `401 SESSION_EXPIRED` after 30 minutes idle or 12 hours since sign-in.
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Origin: "{{appOrigin}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200 or 201', () => pm.expect([200, 201]).to.include(pm.response.code));
      const json = pm.response.json();
      if (json.token) pm.collectionVariables.set('accessToken', json.token);
    language: text/javascript
order: 2500
