$kind: http-request
description: |-
  Registers a new user via `AuthService.registerUser`.

  **Auth:** none

  **Body:** `RegisterUserDto`

  > **Note:** The exact body schema lives in the Zod schema referenced by the controller. The example body below is illustrative; adjust the fields to match your schema.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "jane@example.com",
      "password": "StrongP@ssw0rd"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 201]', () => pm.expect([200, 201]).to.include(pm.response.code));
    language: text/javascript
order: 1000
