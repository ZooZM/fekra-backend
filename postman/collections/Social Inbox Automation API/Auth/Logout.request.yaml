$kind: http-request
description: |-
  Ends the session: the cookie is cleared and every access token issued for it stops working at once.

  **Needs:** the `fekra_session` cookie and an `Origin` header equal to `APP_ORIGIN` (the `appOrigin` variable). Returns `204`.
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  Origin: "{{appOrigin}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 204', () => pm.expect(pm.response.code).to.eql(204));
    language: text/javascript
order: 3000
