$kind: http-request
description: |-
  Fetches a client. Uses `{{resourceId}}` (set it to a client id, or copy from `clientId`).

  The record never carries a token. `hasAccessToken` and `hasInstaAccessToken` say which tokens are stored: when `hasInstaAccessToken` is true, Instagram calls use the Instagram token on graph.instagram.com; otherwise they use the Page token. The list, create and edit responses carry the same two fields.
url: "{{baseUrl}}/clients/:id"
method: GET
pathVariables:
  id: "{{resourceId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.test('Says which tokens are stored, never the tokens', () => {
          pm.expect(json.hasAccessToken).to.be.a('boolean');
          pm.expect(json.hasInstaAccessToken).to.be.a('boolean');
          pm.expect(json).to.not.have.property('accessToken');
          pm.expect(json).to.not.have.property('instaAccessToken');
        });
      }
    language: text/javascript
order: 3000
