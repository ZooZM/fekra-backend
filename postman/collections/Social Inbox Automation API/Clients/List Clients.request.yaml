$kind: http-request
description: |-
  Lists clients.

  **Requires:** `ADMIN` role.

  **Query:** `QueryClientDto`: `page`, `limit`, `orderBy` (`name`, `businessCategory`, `createdAt`), `orderDir`, and `search` (1 to 100 characters, matches name or category ignoring case; `%` and `_` are literal).
url: "{{baseUrl}}/clients?page=1&limit=20"
method: GET
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number
  - key: limit
    value: "20"
    disabled: false
    description: Page size
  - key: search
    value: cafe
    disabled: true
    description: Matches business name or category, ignoring case (1-100 characters)
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 2000
