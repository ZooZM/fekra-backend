$kind: http-request
description: |-
  Lists offers.

  **Query:** `QueryOfferDto`
url: "{{baseUrl}}/offers?page=1&limit=20"
method: GET
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number
  - key: limit
    value: "20"
    disabled: false
    description: Page size
  - key: clientId
    value: "{{clientId}}"
    disabled: true
    description: Filter by client
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 2000
