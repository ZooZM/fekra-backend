$kind: http-request
description: |-
  Creates an offer.

  **Body:** `CreateOfferDto`

  > **Note:** The exact body schema lives in the Zod schema referenced by the controller. The example body below is illustrative; adjust the fields to match your schema.
url: "{{baseUrl}}/offers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "clientId": "{{clientId}}",
      "title": "Weekend Special",
      "description": "20% off all drinks",
      "price": 99.99
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is one of [200, 201]', () => pm.expect([200, 201]).to.include(pm.response.code));
      const json = pm.response.json();
      const id = json.id || json._id || (json.data && (json.data.id || json.data._id));
      if (id) { pm.collectionVariables.set('offerId', id); console.log('offerId saved:', id); }
    language: text/javascript
order: 1000
