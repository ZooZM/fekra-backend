$kind: http-request
description: Fetches an offer. Uses `{{resourceId}}` (copy from `offerId`).
url: "{{baseUrl}}/offers/:id"
method: GET
pathVariables:
  id: "{{resourceId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 3000
