$kind: http-request
name: "Callback: Comment Reply (engagement)"
description: |-
  Used when the pending request is a comment. `type` must be `engagement` or `question` (defaults to `engagement`).

  For `engagement`, typically `publicReply` is used.
url: "{{baseUrl}}/n8n/callback"
method: POST
headers:
  x-webhook-secret: "{{n8nWebhookSecret}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "pending-request-id",
      "type": "engagement",
      "publicReply": "Thanks for the love! \u2764\ufe0f"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 2000
