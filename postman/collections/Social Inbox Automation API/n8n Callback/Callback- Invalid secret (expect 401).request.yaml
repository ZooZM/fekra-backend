$kind: http-request
name: "Callback: Invalid secret (expect 401)"
description: "Negative test: wrong secret returns 401."
url: "{{baseUrl}}/n8n/callback"
method: POST
headers:
  x-webhook-secret: wrong
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "x",
      "text": "hi"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [401]', () => pm.expect([401]).to.include(pm.response.code));
    language: text/javascript
order: 4000
