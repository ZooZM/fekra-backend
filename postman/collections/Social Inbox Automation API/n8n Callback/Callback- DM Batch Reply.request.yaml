$kind: http-request
name: "Callback: DM Batch Reply"
description: |-
  Used when the pending request is of kind `batch` (direct messages). `replyType` is optional (`text` by default, or `voice`). Voice replies pass through a TODO handler before the existing reply flow. Empty/blank `text` sends nothing.

  **Responses:** `200 {acknowledged:true}` | `200 {acknowledged:false}` (duplicate/expired) | `422` `INPUT_VALIDATION_ERROR` missing id or a `type` other than `engagement`/`question` (was `400` before feature 004) | `401` bad secret (checked first)

  Extra keys are ignored, and `null` or `""` texts mean "not sent".
url: "{{baseUrl}}/n8n/callback"
method: POST
headers:
  x-webhook-secret: "{{n8nWebhookSecret}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "pending-request-id",
      "text": "Hi! We're open daily from 8am to 11pm.",
      "replyType": "text"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 1000
