$kind: http-request
name: "Upsert Lead: Invalid secret (expect 401)"
description: "Negative test: a wrong secret returns 401 before the body is read."
url: "{{baseUrl}}/n8n/leads"
method: POST
headers:
  x-webhook-secret: wrong
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "clientId": "{{clientId}}",
      "platform": "facebook",
      "accountId": "{{pageId}}",
      "senderId": "{{customerId}}",
      "stage": "new"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [401]', () => pm.expect([401]).to.include(pm.response.code));
    language: text/javascript
order: 3000
