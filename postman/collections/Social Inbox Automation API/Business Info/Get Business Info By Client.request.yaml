$kind: http-request
description: Fetches the business info of a client.
url: "{{baseUrl}}/business-info/client/:clientId"
method: GET
pathVariables:
  clientId: "{{clientId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200]', () => pm.expect([200]).to.include(pm.response.code));
    language: text/javascript
order: 2000
