$kind: http-request
description: Deletes the business info of a client.
url: "{{baseUrl}}/business-info/client/:clientId"
method: DELETE
pathVariables:
  clientId: "{{clientId}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is one of [200, 204]', () => pm.expect([200, 204]).to.include(pm.response.code));
    language: text/javascript
order: 4000
